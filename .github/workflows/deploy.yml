# ─────────────────────────────────────────────────────────────────────────
# Deploy · ecotech_demo
#
# Solo se ejecuta cuando la CI terminó en verde sobre main: nada que no pasó
# las pruebas llega al servidor.
#
# La dirección, el usuario y la clave del servidor son secretos del
# repositorio (VPS_HOST, VPS_USER, VPS_SSH_KEY): este archivo es público y no
# los contiene. En el servidor, la clave tiene un comando forzado: lo único que
# puede hacer es ejecutar el script de deploy, aunque alguien la obtuviera.
# ─────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:          # deploy manual desde la pestaña Actions

concurrency:
  group: deploy
  cancel-in-progress: false   # un deploy a medias es peor que uno en cola

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Mientras el servidor no esté dado de alta no hay secretos: se omite sin marcar error
      - name: Comprobar que el servidor está configurado
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then echo "listo=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Sin secretos del servidor todavía: se omite el deploy."; fi

      # Una sola conexión: el servidor limita las conexiones SSH seguidas, y un
      # ssh-keyscan previo abre varias y deja bloqueada la siguiente.
      - name: Ejecutar el deploy en el servidor
        if: steps.config.outputs.listo == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          # El servidor ignora este valor y ejecuta siempre su comando forzado: se deja
          # explícito para que se lea qué corre.
          script: /opt/ecotech_demo/deploy.sh

      - name: Verificar la API y la interfaz
        if: steps.config.outputs.listo == 'true'
        run: |
          curl -fsS --retry 3 --retry-delay 5 https://ecotech-api.antostudio.cl/api/health/
          curl -fsS -o /dev/null -w "HTTP %{http_code} · https://ecotech.antostudio.cl/\n" \
            --retry 3 --retry-delay 5 https://ecotech.antostudio.cl/
